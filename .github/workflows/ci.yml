name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Fails on any npm advisory with a patched release; .github/audit-allowlist.txt names the ones without.
      - name: npm audit
        run: node .github/scripts/audit-gate.mjs .
      - name: npm audit (deskhand mobile)
        run: node .github/scripts/audit-gate.mjs examples/deskhand/mobile
      - run: npm run build
      - run: npm run build:docs
      - run: npm run typecheck
      - run: npx playwright-core install --with-deps chromium
      - run: sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm test
      - run: npm run check:brand
      - run: npm pack --workspace @brand-studio/ui --dry-run --ignore-scripts

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: npm run e2e

  a11y:
    name: a11y (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [light, dark]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:docs
      - run: npx playwright-core install --with-deps chromium
      - run: npm run a11y
        env:
          A11Y_MODE: ${{ matrix.mode }}

  # Branch protection requires a check named `verify`, so this job reports the result of the jobs above.
  verify:
    name: verify
    needs: [checks, e2e, a11y]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
