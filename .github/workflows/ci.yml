name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Fails on any npm advisory with a patched release; .github/audit-allowlist.txt names the ones without.
      - name: npm audit
        run: node .github/scripts/audit-gate.mjs .
      - name: npm audit (deskhand mobile)
        run: node .github/scripts/audit-gate.mjs examples/deskhand/mobile
      - run: npm run build
      - run: npm run build:docs
      - run: npm run typecheck
      - run: npx playwright-core install --with-deps chromium
      - run: sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm test
      - run: npm run check:brand
      - run: npm run e2e
      - run: npm run a11y
      - run: npm pack --workspace @brand-studio/ui --dry-run --ignore-scripts
